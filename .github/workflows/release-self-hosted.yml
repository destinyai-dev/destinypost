name: Release self-hosted

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build installation package
        shell: bash
        run: |
          chmod +x deployment/self-hosted/build-release.sh
          deployment/self-hosted/build-release.sh
          sed -i \
            "s|ghcr.io/destinyai-dev/destinypost:latest|ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}|" \
            dist/self-hosted/install.sh
          sed -i \
            "s|destinyai-dev/destinypost|${GITHUB_REPOSITORY}|g" \
            dist/self-hosted/install.sh
          (
            cd dist/self-hosted
            sha256sum install.sh > install.sh.sha256
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/self-hosted/install.sh
            dist/self-hosted/install.sh.sha256
            dist/self-hosted/destinypost-self-hosted.tar.gz
            dist/self-hosted/destinypost-self-hosted.tar.gz.sha256
